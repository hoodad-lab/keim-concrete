<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KEIM Project Studio</title>
<link rel="icon" href="https://www.keim.com.au/favicon.ico">
<meta name="theme-color" content="#D71A1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KEIM Studio">
<script src="team-data.js"></script>
<script src="keim-team-adapter.js"></script>
<style>body{margin:0;background:#F9F7F1}@media (prefers-color-scheme:dark){body{background:#18191B}}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#F9F7F1; --surface:#FFFFFF; --surface-2:#F3EFE6; --ink:#232427; --ink-2:#46494D; --muted:#716B61; --line:#E3DCCD;
  --logo-word:#36393A; --logo-red:#D71A1D;
  --red:#D62025; --red-deep:#B8151A; --red-soft:#FBE7E5; --sand:#F1E6D2; --ochre:#AC6B3F;
  --st-draft:#7D776D; --st-review:#A86A10; --st-approved:#2D6C73; --st-published:#2F7A3B; --st-retired:#9A958C;
  --st-draft-bg:#EEEAE2; --st-review-bg:#FBEFD9; --st-approved-bg:#DDEFF0; --st-published-bg:#E1F0DF; --st-retired-bg:#EFEDE9;
  --shadow:0 1px 2px rgba(35,36,39,.06),0 6px 24px rgba(35,36,39,.06);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#18191B; --surface:#222427; --surface-2:#2A2C30; --ink:#F1EEE8; --ink-2:#D2CDC4; --muted:#9E978C; --line:#383B40;
  --logo-word:#F1EEE8; --logo-red:#D71A1D;
  --red:#EE4A4E; --red-deep:#FF6A6D; --red-soft:#3A2224; --sand:#3A3128; --ochre:#D69C70;
  --st-draft:#B3ADA3; --st-review:#E3A548; --st-approved:#6FC1C8; --st-published:#79C483; --st-retired:#8A857D;
  --st-draft-bg:#2F3033; --st-review-bg:#3A2F1C; --st-approved-bg:#1D3436; --st-published-bg:#1F3322; --st-retired-bg:#2A2A2A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#18191B; --surface:#222427; --surface-2:#2A2C30; --ink:#F1EEE8; --ink-2:#D2CDC4; --muted:#9E978C; --line:#383B40;
  --logo-word:#F1EEE8; --logo-red:#D71A1D;
  --red:#EE4A4E; --red-deep:#FF6A6D; --red-soft:#3A2224; --sand:#3A3128; --ochre:#D69C70;
  --st-draft:#B3ADA3; --st-review:#E3A548; --st-approved:#6FC1C8; --st-published:#79C483; --st-retired:#8A857D;
  --st-draft-bg:#2F3033; --st-review-bg:#3A2F1C; --st-approved-bg:#1D3436; --st-published-bg:#1F3322; --st-retired-bg:#2A2A2A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-stretch:88%;text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{height:40px;width:auto;display:block}
.brand b{font-family:var(--f-display);font-weight:800;font-stretch:110%;letter-spacing:.06em;font-size:20px}
.brand span{font-size:16px!important;font-family:var(--f-display);font-weight:500;font-stretch:90%;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;font-size:15px}
.tab .count{font-family:var(--f-mono);font-size:11px;background:var(--st-review-bg);color:var(--st-review);border-radius:9px;padding:1px 6px;margin-left:6px}
.role{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--sand);color:var(--ochre)}
.role.admin{background:var(--red-soft);color:var(--red)}

.notice{background:var(--st-review-bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
input.i,select.i,textarea.i{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;font-size:14px;width:100%;min-width:0}
textarea.i{resize:vertical;min-height:64px}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--ink-2);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-draft{color:var(--st-draft);background:var(--st-draft-bg)} .st-review{color:var(--st-review);background:var(--st-review-bg)}
.st-approved{color:var(--st-approved);background:var(--st-approved-bg)} .st-published{color:var(--st-published);background:var(--st-published-bg)}
.st-retired{color:var(--st-retired);background:var(--st-retired-bg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-size:14px;z-index:50;box-shadow:var(--shadow)}

/* builder */
.build{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:1020px){.build{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.area{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.area:focus-within{overflow:visible;position:relative;z-index:6}
.area-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.area-n{font-family:var(--f-mono);font-size:12px;background:var(--ink);color:var(--bg);border-radius:4px;padding:2px 7px}
.area-h input{border:0;background:none;font-weight:600;font-size:15px;flex:1;min-width:0;padding:2px 0}
.area-h input:focus{outline:none;border-bottom:1px solid var(--ink-2)}
.area-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt:hover{border-color:var(--ink-2)}
.opt.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.opt .t{font-weight:600;font-size:14px}
.opt .m{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11px;border-radius:3px;padding:1px 6px;background:var(--sand);color:var(--ink-2)}
.seq{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px}.seq .arr{color:var(--muted);font-size:12px}.chip.opt{background:none;border:1px dashed var(--line);color:var(--muted)}
.subnote{margin:0;font-size:13px;background:var(--surface-2);border-left:3px solid var(--ochre);padding:8px 10px;border-radius:4px}
.qstep{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px}
.qstep span{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-family:var(--f-mono)}
.abs{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--st-review);background:var(--st-review-bg);border-radius:3px;padding:1px 5px;align-self:flex-start}
.sw{display:block;height:54px;border-radius:5px;border:1px solid rgba(0,0,0,.08)}
.sw-render{background:radial-gradient(circle at 20% 30%,rgba(0,0,0,.06) 1px,transparent 1.5px) 0 0/7px 7px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.5) 1px,transparent 1.5px) 0 0/9px 9px,#D9CFBE}
.sw-lime{background:radial-gradient(circle at 30% 40%,rgba(0,0,0,.05) 1px,transparent 1.6px) 0 0/6px 6px,linear-gradient(135deg,#EFE9DC,#E2D9C6)}
.sw-bagged{background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.35),transparent 60%) 0 0/28px 18px,repeating-linear-gradient(0deg,#CDBFA8 0 16px,#BFAF95 16px 17px),#CDBFA8}
.sw-brick{background:linear-gradient(90deg,#E7DDD0 2px,transparent 2px) 0 0/34px 14px,linear-gradient(90deg,#E7DDD0 2px,transparent 2px) 17px 7px/34px 14px,repeating-linear-gradient(0deg,#A4492F 0 12px,#E7DDD0 12px 14px)}
.sw-block{background:linear-gradient(90deg,#B9B6AE 3px,transparent 3px) 0 0/44px 22px,linear-gradient(90deg,#B9B6AE 3px,transparent 3px) 22px 11px/44px 22px,repeating-linear-gradient(0deg,#9D9B95 0 19px,#B9B6AE 19px 22px),radial-gradient(circle,rgba(0,0,0,.18) 1px,transparent 1.5px) 0 0/5px 5px}
.sw-concrete{background:radial-gradient(circle at 30% 30%,rgba(0,0,0,.25) 1.5px,transparent 2px) 0 0/19px 17px,radial-gradient(circle at 70% 70%,rgba(0,0,0,.15) 1px,transparent 1.5px) 0 0/11px 13px,linear-gradient(90deg,transparent 49.5%,rgba(0,0,0,.08) 50%,transparent 50.5%) 0 0/60px 100%,#A9A7A1}
.sw-grc{background:radial-gradient(circle,rgba(0,0,0,.08) 1px,transparent 1.4px) 0 0/6px 6px,linear-gradient(160deg,#D4D2CC,#C3C1BA)}
.sw-mgo{background:radial-gradient(circle,rgba(0,0,0,.06) 1px,transparent 1.5px) 0 0/5px 5px,linear-gradient(180deg,#E9E7E1,#DCD9D1)}.sw-timber{background:repeating-linear-gradient(180deg,#B98A5E 0 14px,#A87A50 14px 16px,#C29466 16px 30px,#8E6542 30px 32px)}.sw-fc{background:linear-gradient(90deg,transparent 48%,rgba(0,0,0,.12) 49%,rgba(0,0,0,.12) 51%,transparent 52%) 0 0/48px 100%,linear-gradient(180deg,#C9C7C1,#BDBBB4)}
.sw-blueboard{background:linear-gradient(90deg,transparent 49%,rgba(255,255,255,.35) 50%,transparent 51%) 0 0/48px 100%,radial-gradient(circle,rgba(255,255,255,.2) 1px,transparent 1.5px) 0 0/6px 6px,#5F8DB5}
.sw-aac{background:radial-gradient(circle,rgba(0,0,0,.16) 1.4px,transparent 2px) 0 0/8px 7px,radial-gradient(circle,rgba(0,0,0,.1) 1px,transparent 1.5px) 3px 4px/6px 6px,#ECEAE4}
.sw-stone{background:repeating-linear-gradient(8deg,rgba(120,80,30,.12) 0 3px,transparent 3px 9px),linear-gradient(120deg,#D8B98A,#C9A26B)}
.sw-painted{background:linear-gradient(135deg,#E9E4DA 0 60%,#DCD5C8 60%)}
.sw-patchy{background:radial-gradient(ellipse at 30% 40%,#CBBFAE 0 30%,transparent 31%),radial-gradient(ellipse at 75% 65%,#E3DACB 0 25%,transparent 26%),#D8CFBF}
.sw-cracked{background:linear-gradient(115deg,transparent 45%,rgba(60,50,40,.5) 46%,transparent 47%),linear-gradient(35deg,transparent 60%,rgba(60,50,40,.4) 61%,transparent 62%),#D6CCBA}
.sw-keim{background:linear-gradient(135deg,#C9D6CC,#B7C7BA)}
.sw-plasterboard{background:linear-gradient(90deg,transparent 49%,rgba(0,0,0,.06) 50%,transparent 51%) 0 0/64px 100%,#F2F0EB}
.empty{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:12px}
.optsteps{display:flex;flex-direction:column;gap:4px;font-size:13px}
.optsteps label{display:flex;gap:8px;align-items:center;color:var(--ink-2)}
.optsteps input{accent-color:var(--red)}
.addarea{border:1.5px dashed var(--line);background:none;border-radius:10px;padding:14px;font-weight:600;color:var(--muted);cursor:pointer}
.addarea:hover{border-color:var(--red);color:var(--red)}
.sticky{position:sticky;top:calc(76px + env(safe-area-inset-top,0px))}
@media (max-width:1020px){.sticky{position:static}}
.docbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.docscroll{max-height:calc(100vh - 150px);overflow:auto;border-radius:6px;background:var(--surface-2);padding:18px;border:1px solid var(--line)}
@media (max-width:1020px){.docscroll{max-height:none;padding:8px}}

/* spec document — fixed paper look in both themes */
.doc{background:#fff;color:#222;width:100%;max-width:794px;margin:0 auto;font:11.5px/1.5 var(--f-body);box-shadow:0 2px 12px rgba(0,0,0,.12)}
.doc *{color:inherit}
.doc h1,.doc h2,.doc h3{text-wrap:wrap;letter-spacing:.01em}
.doc .pg{padding:44px 48px}
.doc .cover{background:#fff;border-bottom:1px solid #e6e1d6;position:relative;overflow:hidden}
.doc .cover .wedge{position:absolute;right:-20px;top:-6px;width:230px}
.doc .logo{display:flex;align-items:center;gap:14px}
.doc .logo svg{display:block}
.doc .logo b{font-family:var(--f-display);font-weight:800;font-stretch:110%;letter-spacing:.07em;font-size:19px;color:#222}
.doc .logo span{font-size:9.5px;line-height:1.5;color:#716B61;letter-spacing:.1em;text-transform:uppercase;border-left:1px solid #ddd;padding-left:14px}
.doc .kicker{margin-top:52px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#D62025;font-weight:600}
.doc h1{font-size:30px;font-stretch:85%;color:#222;margin:6px 0 4px;max-width:70%}
.doc .addr{color:#555;font-size:13px}
.doc .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 18px;margin-top:28px;border-top:2px solid #222;padding-top:12px}
.doc .meta div{display:flex;flex-direction:column}
.doc .meta span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#8a8479}
.doc .meta strong{font-weight:600;font-size:11.5px}
.doc h2{font-size:15px;font-stretch:90%;text-transform:uppercase;letter-spacing:.06em;color:#222;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.doc h2 em{font-style:normal;font-family:var(--f-mono);font-size:10px;color:#D62025;letter-spacing:0}
.doc table{width:100%;border-collapse:collapse;font-size:10.5px}
.doc th{text-align:left;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#8a8479;font-weight:600;border-bottom:1px solid #222;padding:5px 6px}
.doc td{padding:6px;border-bottom:1px solid #ece7dc;vertical-align:top}
.doc td.num,.doc th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.doc .sec{padding:26px 48px;border-top:1px solid #ece7dc}
.doc .areahd{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;margin-bottom:12px}
.doc .areahd .no{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;color:#D62025}
.doc .areahd h3{font-size:16px;color:#222}
.doc .areahd .sub{color:#666;font-size:11px}
.doc .areahd .sq{text-align:right;font-family:var(--f-mono);font-size:18px;font-weight:500;line-height:1}
.doc .areahd .sq small{display:block;font-family:var(--f-body);font-size:9px;color:#8a8479;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.doc .sysbox{background:#F6F2EA;border-left:3px solid #D62025;padding:9px 12px;margin-bottom:12px}
.doc .sysbox b{font-size:12px}
.doc .sysbox .code{font-family:var(--f-mono);font-size:10px;color:#AC6B3F}
.doc .steps{counter-reset:s;display:flex;flex-direction:column}
.doc .step{display:grid;grid-template-columns:22px 110px 1fr 92px;gap:10px;padding:7px 0;border-bottom:1px solid #ece7dc;break-inside:avoid}
.doc .step .n{font-family:var(--f-mono);font-size:10px;color:#fff;background:#222;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.doc .step .stg{font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.doc .step .stg i{display:block;font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;color:#8a8479;font-size:9.5px}
.doc .step .pr{font-weight:600}
.doc .step .dl{color:#AC6B3F;font-size:10px}
.doc .step .rt{text-align:right;font-family:var(--f-mono);font-size:10.5px}
.doc .step .rt small{display:block;font-size:9px;color:#8a8479}
.doc .note{font-size:10px;color:#555;margin-top:8px}
.doc .fine{font-size:9.5px;color:#555;columns:2;column-gap:28px}
.doc .fine p{margin:0 0 8px;break-inside:avoid}
.doc .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:9px;color:#8a8479;padding:14px 48px;border-top:2px solid #222}
.doc .avoid{break-inside:avoid;page-break-inside:avoid}
.doc a.dl2{color:#B8151A;text-decoration:underline;text-underline-offset:2px;font-size:9.5px;font-weight:600;margin-right:10px;white-space:nowrap}
.doc .docs td a{color:#B8151A;font-weight:600;text-decoration:underline}
.doc .tl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;margin:4px 0 14px}
.doc .tl .nd{display:flex;align-items:center;gap:6px;background:#222;color:#fff;border-radius:14px;padding:4px 10px 4px 4px;font-size:10px;font-weight:600}
.doc .tl .nd i{font-style:normal;background:#D62025;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:9px}
.doc .tl .nd small{font-weight:400;color:#cfcac0;font-size:9px}
.doc .tl .gap{display:flex;flex-direction:column;align-items:center;min-width:54px;padding:0 4px}
.doc .tl .gap span{font-family:var(--f-mono);font-size:8.5px;color:#AC6B3F;white-space:nowrap}
.doc .tl .gap b{display:block;width:100%;height:0;border-top:1.5px dashed #AC6B3F;position:relative}
.doc .tl .gap b::after{content:"";position:absolute;right:-1px;top:-4.5px;border:3.5px solid transparent;border-left:5px solid #AC6B3F}
.doc .gd{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:10px}
.doc .gd h4{margin:0 0 3px;font-family:var(--f-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#D62025}
.doc .gd p,.doc .gd ul{margin:0;font-size:10px;color:#333}
.doc .gd ul{padding-left:14px}
.doc .dd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc .dd div{border-radius:4px;padding:8px 10px;font-size:10px}
.doc .dd .y{background:#EAF3E7}.doc .dd .n{background:#FBE9E7}
.doc .dd h4{margin:0 0 4px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.doc .dd .y h4{color:#2F7A3B}.doc .dd .n h4{color:#B8151A}
.doc .dd ul{margin:0;padding-left:14px}
.doc .gsys{padding-top:14px;margin-top:14px;border-top:1px solid #ece7dc}
.doc .gsys:first-of-type{border-top:0;margin-top:0;padding-top:0}
.doc .superseded{color:#B8151A;font-weight:600;font-size:10px}

/* ===== v8 guided wizard ===== */
.wzprog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.wzprog .s{display:flex;align-items:center;gap:9px;min-width:0;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}

.wzprog .s.cur{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

.wq{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:12px;position:relative;padding-bottom:16px;width:100%;text-align:left;background:none;border:0;padding-inline:0;padding-top:0;scroll-margin-top:90px}

.wq.done .qt{font-weight:500;color:var(--ink-2);font-size:14px}
.wq.done .av{display:block;color:var(--st-published);font-weight:700;font-size:14.5px;margin-top:1px}

.ans button small{font-weight:400;font-size:12px;color:var(--muted);line-height:1.3}
.ans button:hover{border-color:var(--ink-2)}

.ans button .rec{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--st-review);background:var(--st-review-bg);border-radius:3px;padding:1px 5px}

.wzdone{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}

.pcard .pimg{background:var(--surface-2);border-radius:10px;display:flex;align-items:center;justify-content:center;aspect-ratio:1}
.pcard .pt{display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard b{font-family:var(--f-display);font-size:16px;font-stretch:90%;line-height:1.2}
.pcard small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre);font-weight:600}
.pcard .pt>.pdesc{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pflag{position:absolute;top:8px;right:8px}
.pd{display:flex;flex-direction:column;gap:18px;margin-top:10px}
.pd-top{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:26px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.pd-img{background:var(--surface-2);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:16px;aspect-ratio:1}
.pd-img svg{width:100%;height:auto;max-width:240px}
.pd-h{display:flex;flex-direction:column;gap:10px;min-width:0}
.pd-h h1{font-size:34px}
.pd-h .lead{margin:0;font-size:16px;color:var(--ink-2)}
.pd-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.pd-facts div{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pd-facts span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pd-facts b{font-size:13.5px;font-weight:600;line-height:1.35}
.pd-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.ph2{font-size:19px}
.pp{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cbox{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.cbox span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cbox b{font-size:20px;font-weight:600}
.cbox input{background:var(--surface);font-size:18px}
.cbox.hi{background:var(--red-soft)}
.cbox.hi b{color:var(--red)}
.cbox small{font-size:12px;color:var(--ink-2)}
.hint2{margin:0;font-size:12px;color:var(--muted)}
.clause{margin:0;font-size:13.5px;line-height:1.6;background:var(--surface-2);border-left:3px solid var(--red);padding:12px 14px;border-radius:4px;font-family:var(--f-body)}
.pdocs{display:flex;flex-direction:column;gap:8px}
.pdoc{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;justify-content:center}
.pdoc:hover{border-color:var(--ink-2)}
.pdoc svg{color:var(--red)}
.psys{display:flex;flex-direction:column;gap:8px}
.psy{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.psy:hover{border-color:var(--ink-2)}
.psy .mono{font-size:11px;color:var(--ochre)}
.psy b{font-size:13.5px}
.repcard{display:flex;align-items:center;gap:12px}
.repcard .av{width:44px;height:44px;border-radius:50%;background:var(--logo-word);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700}
.repcard b{display:block}
.repcard small{color:var(--muted);font-size:12.5px}
.repbtns{display:flex;flex-direction:column;gap:8px}
.repbtns .btn{color:var(--ink);justify-content:center;text-decoration:none;min-height:46px;border-radius:999px}.repbtns .btn.primary{color:#fff}
.peditor textarea{font-size:13px}
.reprow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.doc .clz{margin-bottom:9px}.doc .clz b{font-size:11px}.doc .clz p{margin:2px 0 0;font-size:10px;color:#333;line-height:1.5}
@media (max-width:900px){.pd-grid{grid-template-columns:minmax(0,1fr)}.reprow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:640px){
  .pd-top{grid-template-columns:minmax(0,1fr);padding:14px;gap:14px}
  .pd-img{max-width:240px;margin:0 auto;width:100%}
  .pd-h h1{font-size:28px}
  .calc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .calc .cbox.hi{grid-column:1/-1}
  .pgrid{grid-template-columns:minmax(0,1fr)}
  .pfilter .looks{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}.pfilter .looks::-webkit-scrollbar{display:none}.pfilter .fchip{flex:none}
  .pcard{grid-template-columns:80px minmax(0,1fr)}
}
.addrow{display:flex;flex-direction:column;gap:10px}
.addarea.wz{border-style:solid;border-color:var(--red);background:var(--red-soft);color:var(--ink);display:flex;flex-direction:column;gap:2px;text-align:left}
.addarea.wz b{color:var(--red)}.addarea.wz small{font-weight:400;color:var(--muted);font-size:12.5px}
.hp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px;display:flex;flex-direction:column;gap:12px}
.hp-h{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.hp-h h2{font-size:20px;margin-top:2px}.hp-h small{color:var(--muted);font-size:12.5px}
.hp-c{display:flex;gap:8px}.hc{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:8px 10px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hc b{font-family:var(--f-display);font-size:24px;line-height:1;letter-spacing:0}
.hc.bad{background:var(--red-soft);color:var(--red)}.hc.warn{background:var(--st-review-bg);color:var(--st-review)}.hc.info{background:var(--surface-2);color:var(--ink-2)}
.hp>.btn{align-self:flex-start}
.hl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hl li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.hl .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--muted)}
.hl li.bad .dot{background:var(--red)}.hl li.warn .dot{background:var(--st-review)}
.hl b{display:block;font-size:14px}.hl small{color:var(--muted);font-size:12.5px}
.sitechips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.schip{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:13.5px;line-height:1.3}
.schip small{grid-column:2;font-weight:400;font-size:11.5px;color:var(--st-review)}
.schip .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);grid-row:span 2;position:relative}
.schip:hover{border-color:var(--ink-2)}
.schip.on{border-color:var(--red);background:var(--red-soft)}
.schip.on .bx{background:var(--red);border-color:var(--red)}
.schip.on .bx::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
@media (max-width:640px){.sitechips{grid-template-columns:minmax(0,1fr)}}

.tile .sw{height:84px;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.consline{font-size:13px;color:var(--muted)}.consline b{color:var(--ink);font-size:14px}
.m2in{position:relative;display:block}
.m2in input{font-size:22px!important;padding:14px 56px 14px 16px!important;border:2px solid var(--red)!important;border-radius:12px!important;background:var(--surface)!important;color:var(--ink)}
.m2in input::placeholder{color:var(--muted);font-size:17px}
.m2in em{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:600;color:var(--muted);font-size:16px;pointer-events:none}
.cres{background:var(--surface-2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:text}
.cres span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cres b{font-size:26px;font-weight:600;color:var(--muted)}
.cres small{font-size:13px;color:var(--muted)}
.cres.on{background:var(--red-soft);cursor:default}.cres.on b{color:var(--red)}.cres.on small{color:var(--ink-2);font-weight:600}
.appbox .appic{display:flex;gap:8px;margin:4px 0 2px}
.appic .ai{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--red)}
.appic .ai svg{width:34px;height:34px;padding:5px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.appic .ai i{font-style:normal;font-size:10.5px;font-weight:600;color:var(--ink-2)}
.appic.sm{display:inline-flex;flex-direction:row;gap:4px;margin:0}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.qref{display:flex;gap:6px;flex-wrap:wrap}
.qref span{display:flex;flex-direction:column;line-height:1.15;background:var(--surface-2);border-radius:8px;padding:4px 8px;min-width:0}
.qref span em{font-style:normal;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qref span b{font-family:var(--f-mono,monospace);font-size:12.5px;font-stretch:100%;color:var(--ink)}
.pd .qref{margin:10px 0 4px}.pd .qref span{padding:8px 12px;border-radius:10px}.pd .qref span b{font-size:16px}.pd .qref span em{font-size:10.5px}.appic.sm .ai svg{width:22px;height:22px;padding:2px;border-radius:6px;background:var(--surface-2);box-shadow:none}
.m2in input::-webkit-outer-spin-button,.m2in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.m2in input{-moz-appearance:textfield;appearance:textfield}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.15}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.hi{background:var(--logo-word);border-color:var(--logo-word)}.kpi.hi span,.kpi.hi small{color:var(--bg);opacity:.75}.kpi.hi b{color:var(--bg)}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin-bottom:6px}
.s-m{background:var(--red)}.s-l{background:var(--ochre)}.s-a{background:var(--st-approved)}.s-g{background:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:18px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.carea{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ca-h{display:flex;gap:10px;align-items:baseline}.ca-h b{flex:1;min-width:0}.ca-h .mono{color:var(--muted);font-size:13px}.ca-t{font-weight:600;color:var(--ink)!important;font-size:15px!important}
.ca-bar{display:flex;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ca-sub{font-size:12.5px;color:var(--muted)}
.sumtbl{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sumtbl div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumtbl div.t{font-weight:700}.sumtbl div.t b{font-size:16px}
.ptab input{padding:6px 8px;font-size:13px;min-width:70px}
@media (max-width:1020px){.cgrid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.kpi b{font-size:22px}}
.doc.est .ekpi{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.doc.est .ekpi .k{border:1px solid #e6e1d6;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column}
.doc.est .ekpi .k span{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#8a8479;font-weight:600}
.doc.est .ekpi .k b{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.2}
.doc.est .ekpi .k small{font-size:9.5px;color:#8a8479}
.doc.est .ekpi .k.hi{background:#36393A;border-color:#36393A}.doc.est .ekpi .k.hi b{color:#fff;font-size:26px}.doc.est .ekpi .k.hi span,.doc.est .ekpi .k.hi small{color:#cfcac0}
.doc.est .ebar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:4px 0 6px}
.doc.est .ebar i{display:block;height:100%}
.doc.est .eleg{display:flex;gap:14px;font-size:9.5px;color:#666}.doc.est .eleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.doc.est .ab{display:flex;height:5px;margin-top:4px;background:#f1ede4;border-radius:3px;overflow:hidden;max-width:180px}.doc.est .ab i{display:block;height:100%}
.doc.est .esum{display:grid;grid-template-columns:1fr 260px;gap:20px;align-items:start}
.doc.est .esum p{margin:0 0 6px;font-size:10px;color:#444}
.doc.est .etot td{padding:5px 6px}.doc.est .etot tr.t td{font-weight:700;border-top:1.5px solid #222;font-size:11.5px}
.discl{font-size:12.5px;background:var(--st-review-bg);color:var(--ink);border-radius:10px;padding:10px 12px}
.lc-ovl{position:fixed;inset:0;z-index:90;background:rgba(20,20,22,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media(min-width:640px){.lc-ovl{align-items:center}}
.lc{background:var(--surface);color:var(--ink);border-radius:18px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lc h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px}.lc p{color:var(--muted);font-size:13.5px;margin:0 0 12px;line-height:1.45}
.lc .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:420px){.lc .g2{grid-template-columns:1fr}}
.lc .chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);margin:10px 0}.lc .chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--red)}
.lc .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}.lc .err{color:var(--red);font-size:12.5px;min-height:16px}
.pimgs .cov{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:16/9;margin:6px 0 8px}
.pimgs .cov img{width:100%;height:100%;object-fit:cover;display:block}
.pimgs .cov .tag{position:absolute;left:10px;bottom:10px;background:rgba(20,20,22,.72);color:#fff;font-size:11.5px;padding:4px 8px;border-radius:999px}
.pimgs .cov.empty{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line);cursor:pointer;background:var(--surface)}
.pimgs .cov.empty span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;color:var(--muted);font-size:12.5px;max-width:320px}
.pimgs .cov.empty b{color:var(--ink);font-size:14px}
.pimgs .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pimgs .presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0 12px}
.pimgs .presets button{padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;aspect-ratio:3/2;background:var(--surface-2);cursor:pointer}

function packPlan(qty, packs){
  const ps=[...(packs||[1])].sort((a,b)=>b-a); const plan={}; let rem=qty;
  if (qty<=0) return {plan:{},supplied:0};
  for (let i=0;i<ps.length-1;i++){ const n=Math.floor(rem/ps[i]+1e-9); if(n){plan[ps[i]]=n; rem-=n*ps[i];} }
  const sm=ps[ps.length-1];
  if (rem>1e-9){ const n=Math.ceil(rem/sm-1e-9); plan[sm]=(plan[sm]||0)+n; }
  // if small packs add up to more than one large pack, swap
  if (ps.length>1 && plan[sm]*sm >= ps[0]*0.999 && sm!==ps[0]){ const big=ps[0]; const tot=Object.entries(plan).reduce((a,[k,v])=>a+k*v,0); const alt=Math.ceil(qty/big)*big; if (alt<=tot) return {plan:{[big]:Math.ceil(qty/big)},supplied:alt}; }
  const supplied=Object.entries(plan).reduce((a,[k,v])=>a+Number(k)*v,0);
  return {plan,supplied};
}
function areaLines(area, waste){
  const sys = sysById(area.systemId); if(!sys) return [];
  const f = (Number(area.m2)||0) * (1 + (waste||0)/100); const out=[];
  sys.steps.forEach((st,i)=>{
    if (skipped(area, sys, i)) return;
    if (area.lasurRatio && st.product==="concretal-lasur" && st.diluent==="concretal-fixativ"){ const [p,q]=String(area.lasurRatio).split(":").map(Number); const mix=(st.rate||0)+(st.diluentRate||0); const lp=p/((p+q)||1);
      out.push({product:st.product, qty:mix*lp*f}); if(q) out.push({product:st.diluent, qty:mix*(1-lp)*f}); return; }
    if (st.product && st.rate) out.push({product:st.product, qty:st.rate*f});
    if (st.diluent && st.diluentRate) out.push({product:st.diluent, qty:st.diluentRate*f});
  });
  return out;
}

function hashStr(t){ let h=0; for(const c of String(t||"")) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
function autoPreset(p){ const l=presetsFor(p.category); return l.length?l[hashStr(p.ref)%l.length]:null; }
const presetData={};
async function prepCover(p){ const c=coverInfo(p); if(!c||c.own||presetData[c.src]!==undefined) return;
  try{ const r=await fetch(c.src); if(!r.ok) throw 0; const b=await r.blob(); presetData[c.src]=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(null); fr.readAsDataURL(b); }); }catch(_){ presetData[c.src]=null; } }
function coverFor(p,forPdf){ const c=coverInfo(p); if(!c||!forPdf||c.own) return c; const d=presetData[c.src]; return d?{...c,src:d}:null; }
function coverInfo(p){
  const c=p.cover||{};
  if(c.kind==="upload"&&S.imgs[c.img]) return {src:S.imgs[c.img],own:true};
  if(c.kind==="preset"&&c.key) return {src:presetSrc(c.key.replace(/^other-/,"public-")),own:false};
  const k=autoPreset(p); return k?{src:presetSrc(k),own:false,auto:true}:null;
}
function shrinkImage(file,max,q){
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const r=Math.min(1,max/Math.max(im.width,im.height)); const w=Math.round(im.width*r), h=Math.round(im.height*r);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,w,h); cx.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(u); res(cv.toDataURL("image/jpeg",q)); };
    im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("bad image")); }; im.src=u; });
}

function guideSteps(s, skip){ return s.steps.map((st,j)=>({st,j})).filter(({st,j})=>!(skip||[]).includes(j) && !(st.absorbent && skip==null)); }

function guideSection(p){

  const seen=new Map(); p.areas.forEach(a=>{ const s=sysById(a.systemId); if(!s) return; const sk=skipArr(a,s); const k=s.id+"|"+sk.join(","); if(!seen.has(k)) seen.set(k,{s,skip:sk,areas:[]}); seen.get(k).areas.push(a.name||"Untitled area"); });
  if(!seen.size) return "";
  return `<section class="sec"><h2>Application guide <em>for the applicator</em></h2>
   ${[...seen.values()].map(({s,skip,areas})=>`<div class="gsys"><div class="avoid" style="margin-bottom:6px"><span class="mono" style="font-size:10px;color:#AC6B3F">${esc(s.code)} v${s.version}</span> <b style="font-size:12px">${esc(s.name)}</b><div style="font-size:10px;color:#666">Applies to: ${areas.map(esc).join(", ")}</div></div>${guideBlock(s,skip)}</div>`).join("")}

function canSeePrices(){ return S.isAdmin || !!(S.pricing&&S.pricing.showMembers); }

function unitPrice(pid,grp){ const pr=((S.pricing||{}).prices||{})[pid]; if(!pr) return {v:null}; if(grp&&pr[grp]!=null) return {v:pr[grp],exact:true}; return {v:pr.white??null,exact:grp==="white"||!grp,fallback:Object.keys(pr).length>1}; }
function costCfg(p){ const lab=(S.pricing||{}).labour||{}; p.cost=p.cost||{}; const c=p.cost;
  if(c.perCoat==null) c.perCoat=lab.perCoat??8; if(c.prep==null) c.prep=lab.prep??5; if(c.access==null) c.access=0; if(c.margin==null) c.margin=0; if(c.discount==null) c.discount=0; c.areas=c.areas||{}; c.prod=c.prod||{}; return c; }
function effPrice(c,pid,list,disc){ const o=(c.prod||{})[pid]||{}; const v=Number(o.v); if(o.mode==="price"&&o.v!==""&&o.v!=null&&!isNaN(v)) return v; if(list==null) return null; if(o.mode==="disc"&&o.v!==""&&o.v!=null&&!isNaN(v)) return list*(1-v/100); return list*disc; }
function areaCoats(a){ const s=sysById(a.systemId); if(!s) return 0; return s.steps.filter((st,j)=>!skipped(a,s,j)&&st.product&&!/repair|strip/i.test(st.stage)).length; }
function costModel(p){
  const c=costCfg(p); const waste=p.waste||0; const disc=1-(Number(c.discount)||0)/100;
  const rows=p.areas.filter(a=>sysById(a.systemId)).map(a=>{ const ac=c.areas[a.id]=c.areas[a.id]||{}; const grp=ac.grp||areaPG(a)||"white"; const m2=Number(a.m2)||0;
    const lines=areaLines(a,waste); let mat=0, missing=[], fb=false;
    lines.forEach(l=>{ const u=unitPrice(l.product,grp); const e=effPrice(c,l.product,u.v,disc); if(e==null){ missing.push(l.product); return; } if(u.v!=null&&u.fallback&&grp!=="white") fb=true; mat+=l.qty*e; });
    const coats=areaCoats(a); const rate=ac.rate!=null&&ac.rate!==""?Number(ac.rate):(Number(c.perCoat)||0)*coats+(Number(c.prep)||0);
    const lab=rate*m2; return {a,grp,m2,mat,lab,coats,rate,missing,fb}; });
  const prodGrp={}; rows.forEach(r=>areaLines(r.a,waste).forEach(l=>{ const k=l.product; prodGrp[k]=prodGrp[k]||{qty:0,val:0}; const u=unitPrice(k,r.grp); prodGrp[k].qty+=l.qty; if(u.v!=null) prodGrp[k].val+=l.qty*u.v; }));
  const prods=Object.entries(prodGrp).map(([pid,o])=>{ const pr=S.products[pid]||{name:pid,unit:"",packs:[1]}; const pk=packPlan(o.qty,pr.packs); const has=((S.pricing||{}).prices||{})[pid]; const list=has&&o.qty?o.val/o.qty:null;
    const unit=effPrice(c,pid,list,disc); const ov=(c.prod||{})[pid]||{}; const custom=(ov.mode==="price"||ov.mode==="disc")&&ov.v!==""&&ov.v!=null;
    return {pid,pr,qty:o.qty,supplied:pk.supplied,plan:pk.plan,list,avg:unit,custom,ov,cost:unit!=null?pk.supplied*unit:null}; });
  const m2=rows.reduce((x,r)=>x+r.m2,0); const matPacks=prods.reduce((x,r)=>x+(r.cost||0),0); const lab=rows.reduce((x,r)=>x+r.lab,0);
  const access=Number(c.access)||0; const sub=matPacks+lab+access; const margin=sub*(Number(c.margin)||0)/100; const ex=sub+margin; const gst=ex*0.1;
  return {c,rows,prods,m2,matPacks,lab,access,margin,ex,gst,inc:ex+gst,perM2:m2?ex/m2:0,missing:prods.filter(x=>x.cost==null)};

function workflowButtons(s){
  const b=[];
  if(s.status==="draft"){ b.push(`<button class="btn" data-act="savedraft">Save draft</button>`); b.push(`<button class="btn primary" data-act="wf" data-v="review">Submit for review</button>`); }
  if(s.status==="review"){ b.push(`<button class="btn primary" data-act="wf" data-v="approved">Approve</button>`); b.push(`<button class="btn" data-act="wf" data-v="draft">Return to draft</button>`); }
  if(s.status==="approved"){ b.push(`<button class="btn primary" data-act="wf" data-v="published">Publish to specifiers</button>`); b.push(`<button class="btn" data-act="wf" data-v="draft">Return to draft</button>`); }

const WF_LABEL={review:"Submitted for review",approved:"Approved",published:"Published",draft:"Returned to draft",retired:"Retired"};
async function writeSystem(s){ const d=structuredClone(s); delete d.isNew; d.updatedAt=new Date().toISOString(); await S.db.doc("systems/"+s.id).set(d); s.isNew=false; s.updatedAt=d.updatedAt; }
async function doWorkflow(to){
  const s=S.edit;
  if(to!=="draft" && to!=="retired"){
    if(!s.name.trim()||!s.code.trim()){ toast("Give the system a code and name first."); return; }
    if(!s.substrates.length||!s.environments.length){ toast("Choose at least one environment and substrate."); return; }
    if(!s.steps.some(x=>x.product)){ toast("Add at least one step with a product."); return; }
  }
  s.history=[...(s.history||[]),{at:new Date().toISOString(),by:S.uid,action:WF_LABEL[to],version:s.version}];
  s.status=to;
  try{
    if(to==="published"){ for(const o of S.systems.filter(x=>x.code===s.code && x.id!==s.id && x.status==="published")){ await S.db.doc("systems/"+o.id).update({status:"retired",updatedAt:new Date().toISOString(),history:[...(o.history||[]),{at:new Date().toISOString(),by:S.uid,action:`Retired (replaced by v${s.version})`,version:o.version}]}); } }
    await writeSystem(s); toast(WF_LABEL[to]);
  }catch(e){ toast("Could not update the system. Only KEIM admins can change the library."); }
  S.confirm=null; renderEditor();
}
async function newVersion(){
  const o=S.edit; const maxV=Math.max(...S.systems.filter(x=>x.code===o.code).map(x=>x.version||1));
  const n=structuredClone(o); n.id=rid("sys"); n.version=maxV+1; n.status="draft"; n.parent=o.id;
  n.history=[{at:new Date().toISOString(),by:S.uid,action:`New version created from v${o.version}`,version:n.version}];
  try{ await writeSystem(n); S.edit=n; S.editId=n.id; toast(`Version ${n.version} created as a draft`); renderEditor(); }catch(e){ toast("Could not create the new version."); }
}

function readProdEditor(row){
  const g=k=>{ const el=row.querySelector(`[data-pf="${k}"]`); return el?(el.type==="checkbox"?el.checked:el.value.trim()):undefined; };
  const upd={name:g("name"),category:g("category"),description:g("description"),about:g("about"),application:g("application"),colours:g("colours"),unit:g("unit"),tds:g("tds"),sds:g("sds"),sdsNote:g("sdsNote"),clause:g("clause"),clauseDraft:g("clauseDraft")};
  upd.packs=g("packs").split(",").map(x=>Number(x.trim())).filter(x=>x>0);
  upd.cons=g("cons").split("\n").map(l=>l.split("|")).filter(a=>a.length>=2&&Number(a[1])>0).map(([a,b])=>({label:a.trim(),rate:Number(b)}));
  upd.docs=g("docs").split("\n").map(l=>l.split("|")).filter(a=>a.length>=2&&a[1].trim()).map(([a,...b])=>({label:a.trim(),url:b.join("|").trim()}));
  return upd;
}

document.addEventListener("click", async e=>{
  const tabBtn=e.target.closest("[data-tab]"); if(tabBtn){ go(tabBtn.dataset.tab); return; }
  const el=e.target.closest("[data-act]"); if(!el) return;

  if(act==="cpickclose"&&el.classList.contains("lc-ovl")&&e.target.closest("[data-stop]")) return;
  switch(act){
    case "cpick": S.cpick={target:v,q:"",col:""}; renderPicker(); return;
    case "lzopen": lzOpen(v); return;
    case "lzclose": if(el.classList.contains("lc-ovl")&&e.target.closest("[data-stop]")) return; S.lz=null; renderLz(); return;

    case "ezstart": S.ez={step:0,started:true}; renderEasy(); window.scrollTo(0,0); return;
    case "ezset": { const e=S.ez; const [k,...r]=v.split(":"); const val=r.join(":"); const auto=["env","surf","cond","look","m2"].includes(k);
      if(k==="env"&&e.env!==val){ e.surf=null; e.cond=null; e.look=null; }
      if(k==="surf"&&e.surf!==val){ e.cond=null; e.look=null; }
      e[k]=val; if(k==="m2"){ e.l=""; e.h=""; }

      renderEasy(); return; }
    case "eznext": S.ez.step=(S.ez.step||0)+1; renderEasy(); window.scrollTo(0,0); return;
    case "ezback": S.ez.step=Math.max(0,(S.ez.step||0)-1); renderEasy(); window.scrollTo(0,0); return;
    case "ezreset": S.ez={step:0,started:true}; S.ezRef=null; renderEasy(); window.scrollTo(0,0); return;
    case "ezpdf": el.disabled=true; await ezDownload(); el.disabled=false; return;
    case "ezfull": { const e=S.ez; const sys=ezSystem(e); S.quick={...S.quick,env:e.env,substrate:ezSub(e),look:null,systemId:sys?sys.id:null,m2:Number(e.m2)||0,colour:e.colour||"",site:{}}; S.tab="quick"; render(); window.scrollTo(0,0); return; }
    case "cpcol": S.cpick.col=v; S.cpick.focus=false; renderPicker(); return;
    case "cpickclose": S.cpick=null; renderPicker(); return;
    case "cpset": { const t=S.cpick&&S.cpick.target; S.cpick=null; renderPicker();
      if(t==="q"){ S.quick.colour=v; renderQuick(); }
      else if(t==="ez"){ S.ez.colour=v; renderEasy(); }
      else if(t==="lz"&&S.lz){ S.lz.colour=v; if(!S.lz.sug.some(x=>x[0]===v)) S.lz.sug=[[v,"Your pick"],...S.lz.sug.slice(0,2)]; renderLz(); }
      else if(t&&t.startsWith("a:")){ const ar=(S.project.areas||[]).find(x=>x.id===t.slice(2)); if(ar){ ar.colour=v; touch(); renderBuild(); } }
      return; }
    case "addarea": p.areas.push({id:rid("a"),name:`Area ${p.areas.length+1}`,env:"exterior",substrate:"",m2:0,systemId:null,skip:[],colour:""}); S.projectDirty=true; renderBuild(); break;
    case "duparea": { const a=areaOf(el); const i=p.areas.indexOf(a); p.areas.splice(i+1,0,{...structuredClone(a),id:rid("a"),name:a.name+" (copy)"}); renderBuild(); break; }
    case "delarea": { const a=areaOf(el); p.areas=p.areas.filter(x=>x!==a); renderBuild(); break; }
    case "env": { const a=areaOf(el); if(a.env!==v){ a.env=v; if(!SUBSTRATES[v].some(([k])=>k===a.substrate)){ a.substrate=""; a.systemId=null; } else { a.systemId=optionsFor(a).find(x=>x.id===a.systemId)?.id||null; } } renderBuild(); break; }
    case "pick": { const a=areaOf(el); a.systemId=v; a.skip=[]; renderBuild(); break; }
    case "optstep": { const a=areaOf(el); const j=Number(v); const ss=sysById(a.systemId); if(ss&&ss.steps[j]&&ss.steps[j].pg3){ a.stepOn={...(a.stepOn||{}),[j]:el.checked}; touch(); break; } a.skip=el.checked?(a.skip||[]).filter(x=>x!==j):[...(a.skip||[]),j]; touch(); break; }
    case "newproject": S.project={...exampleProject(),example:false,category:"",cover:null,images:[],name:"",address:"",client:"",architect:"",areas:[{id:rid("a"),name:"Area 1",env:"exterior",substrate:"",m2:0,systemId:null,skip:[],colour:""}]}; S.tab="build"; render(); break;
    case "save": await saveProject(); break;
    case "pdf": el.disabled=true; await downloadPdf(); el.disabled=false; break;
    case "qpdf": el.disabled=true; await downloadPdf(quickProject()); el.disabled=false; break;
    case "qenv": S.quick.env=v; S.quick.substrate=""; S.quick.systemId=null; S.quick.look=null; S.quick.site={}; renderQuick(); break;
    case "qsub": S.quick.substrate=v; S.quick.look=null; S.quick.site={...S.quick.site,abs:undefined}; { const o=quickOptions(); S.quick.systemId=o.length?o[0].id:null; } renderQuick(); setTimeout(()=>{ const e=document.getElementById("qstep3"); if(e) e.scrollIntoView({behavior:"smooth",block:"start"}); },60); break;
    case "qlook": S.quick.look=v||null; { const o=quickOptions(); S.quick.systemId=o.length?o[0].id:null; } renderQuick(); break;
    case "qsite": { const st=S.quick.site=S.quick.site||{}; const cur=siteOn(v); st[v]=!cur; if(v==="structural"&&!cur) st.hairline=false; if(v==="hairline"&&!cur) st.structural=false; const y=window.scrollY; renderQuick(); window.scrollTo(0,y); break; }
    case "wzpick": { const qid=el.dataset.q; const was=S.wz[qid]; S.wz[qid]=v; const editing=!!S.wzEdit; S.wzEdit=null; if(was!==v && qid==="mat"){ S.quickRef=null; }
      wzClean(S.wz); renderQuick();
      setTimeout(()=>{ const e=document.getElementById("wzcur")||document.getElementById("qstep3"); if(e && (!editing || e.id==="qstep3")) { const r=e.getBoundingClientRect(); if(r.top<70||r.top>window.innerHeight*0.55) e.scrollIntoView({behavior:"smooth",block:"start"}); } },40); break; }
    case "wzedit": S.wzEdit=v; renderQuick(); setTimeout(()=>{ const e=document.getElementById("wzcur"); if(e) e.scrollIntoView({behavior:"smooth",block:"start"}); },40); break;
    case "wzcancel": S.wzEdit=null; renderQuick(); break;
    case "wzrestart": S.wz={}; S.wzEdit=null; S.wzSeen=null; S.quick.systemId=null; S.quickRef=null; renderQuick(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "qview": { const e=document.getElementById("qdoc")||document.getElementById("qprev"); if(e) e.scrollIntoView({behavior:"smooth",block:"start"}); break; }
    case "qphases": { const e=document.getElementById("qphases"); if(e) e.scrollIntoView({behavior:"smooth",block:"start"}); break; }
    case "qsys": S.quick.systemId=v; renderQuick(); break;
    case "qtobuild": { const q=quickProject(); const a={...q.areas[0],id:rid("a")}; const forP=S.wzForProject;
      if(!S.project.example && S.project.areas.some(x=>x.substrate)) { S.project.areas.push(a); } else if(!S.project.example && forP){ S.project.areas=[...S.project.areas.filter(x=>x.substrate),a]; } else { S.project={...exampleProject(),example:false,name:q.name,address:q.address||"",client:"",architect:"",areas:[a]}; }
      S.projectDirty=true; S.wzForProject=false; S.wzSeen=null; S.quick={...S.quick,substrate:"",systemId:null,area:"",site:{},look:null,colour:""}; S.quickRef=null; S.tab="build"; render(); window.scrollTo(0,0); toast(forP?"Area added":"Added to the full project builder"); break; }
    case "wzarea": S.wzForProject=true; S.wzSeen=null; S.quick={...S.quick,substrate:"",systemId:null,area:"",site:{},look:null,colour:""}; S.tab="quick"; render(); window.scrollTo(0,0); break;
    case "wzcancelproj": S.wzForProject=false; S.wz={}; S.tab="build"; render(); window.scrollTo(0,0); break;
    case "openproject": { const pr=S.projects.find(x=>x.id===v); if(pr){ S.project=structuredClone(pr); S.tab="build"; render(); window.scrollTo(0,0); loadImgs(S.project);} break; }
    case "projcat": S.project.category=v; touch(); renderBuild(); break;
    case "presets": S.showPresets=!S.showPresets; renderBuild(); break;
    case "presetsall": S.showPresets="all"; renderBuild(); break;
    case "preset": S.project.cover={kind:"preset",key:v}; touch(); renderBuild(); break;
    case "coverauto": S.project.cover=null; touch(); renderBuild(); break;
    case "imgdel": { const i=Number(v); const g=(S.project.images||[])[i]; S.project.images.splice(i,1); if(g&&S.db&&S.uid&&S.project.id){ S.db.doc(imgDocPath(S.project.id,g.id)).delete().catch(()=>{}); } touch(); renderBuild(); break; }
    case "opensys": if(S.isAdmin){ const s=sysById(v); S.editId=v; S.edit=structuredClone(s); S.confirm=null; renderEditor(); } else { S.libDetail=v; renderPublicLibrary(); } window.scrollTo(0,0); break;
    case "libback": S.editId=null; S.edit=null; S.libDetail=null; S.confirm=null; renderLibrary(); break;
    case "newsys": S.edit=blankSystem(); S.editId=S.edit.id; renderEditor(); break;
    case "eenv": { const s=S.edit; s.environments=el.checked?[...new Set([...s.environments,v])]:s.environments.filter(x=>x!==v); break; }
    case "esub": { const s=S.edit; s.substrates=el.checked?[...new Set([...s.substrates,v])]:s.substrates.filter(x=>x!==v); break; }
    case "addstep": S.edit.steps.push({stage:"Finish coat",text:"",product:null,dilution:"",rate:0,diluent:null,diluentRate:0,optional:false}); renderEditor(); break;
    case "stepdel": case "stepup": case "stepdown": { const i=Number(el.closest("[data-step]").dataset.step); const st=S.edit.steps; if(act==="stepdel") st.splice(i,1); else { const j=act==="stepup"?i-1:i+1; [st[i],st[j]]=[st[j],st[i]]; } renderEditor(); break; }
    case "savedraft": try{ if(S.edit.isNew) S.edit.history=[{at:new Date().toISOString(),by:S.uid,action:"Draft created",version:S.edit.version}]; await writeSystem(S.edit); toast("Draft saved"); renderEditor(); }catch(err){ toast("Could not save. Only KEIM admins can change the library."); } break;
    case "wf": if(v==="published"){ const cur=S.systems.find(x=>x.code===S.edit.code&&x.status==="published"&&x.id!==S.edit.id); S.confirm={to:v,label:"Publish",msg:cur?`Publishing v${S.edit.version} makes it live for all specifiers and retires v${cur.version}. Projects using v${cur.version} will be flagged to update.`:"Publishing makes this system live for all specifiers."}; renderEditor(); } else if(v==="retired"){ S.confirm={to:v,label:"Retire",msg:"Retiring removes this system from the builder. Existing projects keep their copy but are flagged as superseded."}; renderEditor(); } else await doWorkflow(v); break;
    case "confirmyes": await doWorkflow(S.confirm.to); break;
    case "confirmno": S.confirm=null; renderEditor(); break;
    case "newversion": await newVersion(); break;
    case "saveprod": { const row=el.closest("[data-prod]"); const id=row.dataset.prod; const upd=readProdEditor(row);
      if([upd.tds,upd.sds,...upd.docs.map(d=>d.url)].some(u=>u && !/^https:\/\//.test(u))){ toast("Links must start with https://"); break; }
      if(!upd.name){ toast("The product needs a name."); break; }
      try{ await S.db.doc("products/"+id).update(upd); toast("Product saved"); S.prodEdit=false; }catch(err){ toast("Could not save. Only KEIM admins can change products."); } break; }
    case "openprod": S.tab="products"; S.prodDetail=v; S.prodEdit=false; S.prodCons=0; render(); window.scrollTo(0,0); break;
    case "prodback": S.prodDetail=null; S.prodEdit=false; renderProducts(); window.scrollTo(0,0); break;
    case "healthtoggle": S.healthOpen=!S.healthOpen; renderProducts(); break;
    case "focusm2": { const i=$("#pc-m2"); if(i) i.focus(); break; }
    case "estpdf": el.disabled=true; await downloadEstimate(); el.disabled=false; break;
    case "savepricing": { const P=structuredClone(S.pricing); document.querySelectorAll("[data-price-pid]").forEach(row=>{ const pid=row.dataset.pricePid; const o={}; row.querySelectorAll("[data-pg]").forEach(i=>{ if(i.value!=="") o[i.dataset.pg]=Number(i.value); }); if(Object.keys(o).length) P.prices[pid]=o; else delete P.prices[pid]; }); P.updated=today(); try{ await S.db.doc("config/pricing").set(P); toast("Price list saved"); }catch(err){ toast("Could not save the price list."); } break; }
    case "savelabour": { const c=costCfg(S.project); const P=structuredClone(S.pricing); P.labour={...(P.labour||{}),perCoat:Number(c.perCoat)||0,prep:Number(c.prep)||0}; try{ await S.db.doc("config/pricing").set(P); toast("Default rates saved"); }catch(err){ toast("Could not save."); } break; }
    case "pcat": S.prodCat=v; renderProducts(); break;
    case "quotereq": quoteRequest(v||"project"); break;
    case "puse": S.prodUse=v||null; S.prodUseManual=!v; S.prodCat=""; renderProducts(); break;
    case "prodedit": S.prodEdit=!S.prodEdit; renderProducts(); break;
    case "prodsys": S.tab="library"; S.prodDetail=null; if(S.isAdmin){ const s0=sysById(v); S.editId=v; S.edit=structuredClone(s0); S.confirm=null; } else S.libDetail=v; render(); window.scrollTo(0,0); break;
    case "copyclause": { const t=$("#clause"); const txt=t?t.textContent:""; try{ await navigator.clipboard.writeText(txt); toast("Clause copied"); }catch(err){ const r=document.createRange(); r.selectNodeContents(t); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Selected. Press copy to copy the clause."); } break; }
    case "repadd": { S.reps=S.reps||{list:[]}; readReps(); S.reps.list.push({name:"",states:[],phone:"",email:""}); renderProducts(); break; }
    case "repdel": { readReps(); const i=Number(el.closest("[data-rep]").dataset.rep); S.reps.list.splice(i,1); renderProducts(); break; }
    case "repsave": { readReps(); try{ await S.db.doc("config/reps").set(structuredClone(S.reps)); toast("Sales consultants saved"); }catch(err){ toast("Could not save consultants."); } break; }
    case "delsys": S.confirm=null; try{ await S.db.doc("systems/"+S.edit.id).delete(); toast("Draft deleted"); S.editId=null; S.edit=null; renderLibrary(); }catch(err){ toast("Could not delete the draft."); } break;
  }
});
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(tabsList().some(([k])=>k===h)) go(h); });

/* ---------- header hides while scrolling down on phones ---------- */
(function(){ const bar=document.querySelector(".bar"); const mq=window.matchMedia("(max-width:899px)"); let last=0;
  const pos=t=>{ if(t&&t!==document&&t.nodeType===1&&t.scrollHeight>t.clientHeight+40&&!t.closest(".bar,.lc-ovl,.tabs,.kcdd,.tbl,.docscroll,.looks")) return t.scrollTop; return window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0; };
  document.addEventListener("scroll",e=>{ const t=e.target; if(t&&t.nodeType===1&&t.closest&&t.closest(".tabs,.kcdd,.tbl,.docscroll,.looks,.qr-list,.lc")) return; const y=pos(t);
    if(!mq.matches){ bar.classList.remove("hide"); last=y; return; }
    if(Math.abs(y-last)<8) return; bar.classList.toggle("hide", y>last && y>140); last=y; },{passive:true,capture:true}); })();

/* ---------- boot ---------- */
S.project = exampleProject();
render();
(async function boot(){
  loadTex();
  const c = window.claude; if(!c || !c.use){ S.loaded=true; render(); return; }
  const [db,user,downloads] = await Promise.all([c.use("db"),c.use("user"),c.use("downloads")]);
  S.db=db; S.user=user; S.downloads=downloads;
  if(user){ S.me=await user.me(); S.uid=S.me.id; S.isAdmin=!!S.me.canEdit; }
  if(!db){ S.loaded=true; render(); return; }
  if(window.KEIM_CONFIG&&KEIM_CONFIG.defaultTab) S.tab=KEIM_CONFIG.defaultTab;
  const h=location.hash.slice(1); if(tabsList().some(([k])=>k===h)) S.tab=h;
  db.collection("config").onSnapshot(snap=>{ const d=snap.docs.find(x=>x.id==="reps"); if(d) S.reps=d.data(); const hd=snap.docs.find(x=>x.id==="health"); if(hd) S.health=hd.data(); const pd=snap.docs.find(x=>x.id==="pricing"); if(pd){ S.pricing=pd.data(); if(S.tab==="costs"&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#app input"))){ renderTabs(); renderCosts(); } } if(S.tab==="products"&&!S.prodDetail&&!S.prodEdit){ renderProducts(); return; } if(S.tab==="products"&&S.prodDetail) renderProducts(); }, ()=>{});
  db.collection("products").onSnapshot(snap=>{ S.products=Object.fromEntries(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}])); if(S.tab==="products"){ if(!S.prodEdit && !(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#app input,#app textarea"))) renderProducts(); return; } if(!S.editId) render(); });
  db.collection("systems").onSnapshot(snap=>{
    S.systems=snap.docs.map(d=>({...d.data(),id:d.id}));
    if(S.editId && S.edit && !S.confirm){ const fresh=sysById(S.editId); if(fresh && fresh.updatedAt!==S.edit.updatedAt && fresh.status!==S.edit.status){ S.edit=structuredClone(fresh); } }
    if(S.tab==="build" && document.activeElement && document.activeElement.closest && document.activeElement.closest("#app input,#app select,#app textarea")) { renderTabs(); renderDoc(); return; }
    if(S.editId){ renderTabs(); return; }
    render();
  });
  if(S.uid){ db.doc(`data/users/${S.uid}/contact`).get().then(d=>{ if(d.exists) S.contact=d.data(); }).catch(()=>{}); }
  if(S.uid){ db.doc(`data/users/${S.uid}/profile`).collection("projects").onSnapshot(snap=>{ S.projects=snap.docs.map(d=>({...d.data(),id:d.id})); if(S.tab==="projects") renderProjects(); }, ()=>{}); }
  if(S.isAdmin){ db.collection("speclog").onSnapshot(snap=>{ S.log=snap.docs.flatMap(d=>d.data().entries||[]); if(S.tab==="activity") renderActivity(); }, ()=>{}); }
  S.loaded=true;
})();
</script>
